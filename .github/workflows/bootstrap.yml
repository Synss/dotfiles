---
name: bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - bin/bootstrap.sh
      - .github/workflows/bootstrap.yml
  schedule:
    # First day of every month at 2:00 AM UTC.
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            host: github-actions-macos
          - os: ubuntu-latest
            host: github-actions-linux
    name: bootstrap on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run bootstrapping
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          ./bin/bootstrap.sh ${{ matrix.host }} 2> ${{ runner.temp }}/bootstrap.err \
          | tee ${{ runner.temp }}/bootstrap.log || [ "$?" -eq 3 ]
          grep -q 'Nix was installed successfully!' ${{ runner.temp}}/bootstrap.log || exit 1
      - name: Setup nix PATH
        run: echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          path: ${{ runner.temp }}/bootstrap.err
          if-no-files-found: error
          retention-days: 8
      - name: Smoke test nix
        run: nix --version
      - name: Smoke test jj
        run: jj --version
      - name: Test bootstrap idempotency
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: ./bin/bootstrap.sh ${{ matrix.host }}
