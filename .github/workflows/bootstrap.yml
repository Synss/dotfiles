name: bootstrap

on:
  schedule:
    # First day of every month at 2:00 AM UTC.
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            host: github-actions-macos
          - os: ubuntu-latest
            host: github-actions-linux
    name: bootstrap on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Test bootstrapping
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/bootstrap-just.sh bootstrap ${{ matrix.host }} | tee bootstrap.log || true
          grep -q 'Nix was installed successfully!' bootstrap.log
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Smoke test
        run: nix --version
